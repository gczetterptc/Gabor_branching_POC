name: Test Codebeamer Status Update

on:
  workflow_dispatch:

jobs:
  update-codebeamer:
    runs-on: ubuntu-latest

    steps:
      - name: GET Codebeamer item
        run: |
          curl -sS \
            -u "${{ secrets.CODEBEAMER_USER }}:${{ secrets.CODEBEAMER_PASSWORD }}" \
            -H "Accept: application/json" \
            "${{ secrets.CODEBEAMER_URL }}/api/v3/items/1025537" \
            -o item.json

          echo "Original item:"
          cat item.json
          echo ""

      - name: Build clean update payload
        run: |
          jq '{
            id: .id,
            name: .name,
            description: .description,
            descriptionFormat: .descriptionFormat,
            version: .version,
            tracker: .tracker,
            priority: .priority,
            status: {
              id: 4,
              name: "PR Merged",
              type: "ChoiceOptionReference"
            },
            assignedTo: .assignedTo,
            categories: .categories,
            subjects: .subjects,
            resolutions: .resolutions,
            severities: .severities,
            teams: .teams,
            versions: .versions,
            startDate: .startDate,
            ordinal: .ordinal,
            typeName: .typeName
          }' item.json > updated.json

          echo "Updated payload:"
          cat updated.json
          echo ""

      - name: PUT updated Codebeamer item
        run: |
          curl -v \
            -u "${{ secrets.CODEBEAMER_USER }}:${{ secrets.CODEBEAMER_PASSWORD }}" \
            -X PUT \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data @updated.json \
            "${{ secrets.CODEBEAMER_URL }}/api/v3/items/1025537"
