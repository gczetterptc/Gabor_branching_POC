name: Update Codebeamer on PR Merge

on:
  pull_request:
    types:
      - closed

jobs:
  update-codebeamer:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Extract Codebeamer ID
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"

          if [[ $BRANCH =~ cb-([0-9]+) ]]; then
            echo "CB_ID=${BASH_REMATCH[1]}" >> $GITHUB_ENV
          else
            echo "No Codebeamer item ID found"
            exit 0
          fi

      - name: Set Status to PR Merged
        run: |
          curl -u "${{ secrets.CODEBEAMER_USER }}:${{ secrets.CODEBEAMER_PASSWORD }}" \
            -X PATCH \
            -H "Content-Type: application/json" \
            "${{ secrets.CODEBEAMER_URL }}/api/v3/items/${CB_ID}/fields" \
            -d '{
                "status": {
                  "id": 4
                }
              }'
