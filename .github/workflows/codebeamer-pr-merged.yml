name: Update Codebeamer Status

on:
  workflow_dispatch:

jobs:
  update-codebeamer:
    runs-on: ubuntu-latest

    steps:
      - name: Get item from Codebeamer
        run: |
          curl -sS \
            -u "${{ secrets.CODEBEAMER_USER }}:${{ secrets.CODEBEAMER_PASSWORD }}" \
            -H "Accept: application/json" \
            "${{ secrets.CODEBEAMER_URL }}/api/v3/items/1025637" \
            > item.json

      - name: Update status and remove field 10000
        run: |
          jq '
            .customFields |= map(select(.fieldId != 10000))
            |
            .status = {
              "id": 4,
              "name": "PR Merged",
              "type": "ChoiceOptionReference"
            }
          ' item.json > updated.json

          echo "Updated payload:"
          cat updated.json

      - name: Update item in Codebeamer
        run: |
          curl -v \
            -u "${{ secrets.CODEBEAMER_USER }}:${{ secrets.CODEBEAMER_PASSWORD }}" \
            -X PUT \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data @updated.json \
            "${{ secrets.CODEBEAMER_URL }}/api/v3/items/1025537"
